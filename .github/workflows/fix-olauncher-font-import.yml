name: Fix Olauncher Font Import

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download previous fixed source build
        uses: actions/download-artifact@v4
        with:
          name: Olauncher-Font-Picker-v6.7.1-fixed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: JohnDSdev/CaptureTheFlag
          run-id: 31116640375
          path: previous

      - name: Extract and repair font import flow
        run: |
          mkdir repaired
          unzip -q previous/Olauncher-Font-Picker-v6.7.1-fixed-source.zip -d repaired
          python3 - <<'PY'
          from pathlib import Path

          root = Path('repaired/olauncher')

          manager = root / 'app/src/main/java/app/olauncher/helper/FontManager.kt'
          manager_text = manager.read_text()
          old = '''        setSelected(context, option.id)\n        option\n'''
          new = '''        option\n'''
          if old not in manager_text:
              raise SystemExit('Could not find automatic font selection in FontManager.kt')
          manager.write_text(manager_text.replace(old, new, 1))

          settings = root / 'app/src/main/java/app/olauncher/ui/SettingsFragment.kt'
          settings_text = settings.read_text()
          old = '''            .onSuccess { option ->\n                requireContext().showToast(getString(R.string.font_added, option.name))\n                requireActivity().recreate()\n            }\n'''
          new = '''            .onSuccess { option ->\n                requireContext().showToast(getString(R.string.font_added, option.name))\n                binding.root.post {\n                    populateFontText()\n                    showFontPicker()\n                }\n            }\n'''
          if old not in settings_text:
              raise SystemExit('Could not find font import success callback in SettingsFragment.kt')
          settings_text = settings_text.replace(old, new, 1)
          settings.write_text(settings_text)

          gradle = root / 'app/build.gradle'
          gradle_text = gradle.read_text().replace('versionName "v6.7.1-fonts1"', 'versionName "v6.7.1-fonts2"')
          gradle.write_text(gradle_text)
          PY

      - name: Build repaired APK
        working-directory: repaired/olauncher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package repaired build
        run: |
          cp repaired/olauncher/app/build/outputs/apk/debug/app-debug.apk Olauncher-Font-Picker-v6.7.1-import-fixed.apk
          (cd repaired && zip -qr ../Olauncher-Font-Picker-v6.7.1-import-fixed-source.zip olauncher)
          sha256sum Olauncher-Font-Picker-v6.7.1-import-fixed.apk Olauncher-Font-Picker-v6.7.1-import-fixed-source.zip > Olauncher-Font-Picker-v6.7.1-import-fixed-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Olauncher-Font-Picker-v6.7.1-import-fixed
          path: |
            Olauncher-Font-Picker-v6.7.1-import-fixed.apk
            Olauncher-Font-Picker-v6.7.1-import-fixed-source.zip
            Olauncher-Font-Picker-v6.7.1-import-fixed-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
