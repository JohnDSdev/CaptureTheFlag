name: Build Olauncher Matrix Sans

on:
  push:
    branches:
      - build/olauncher-matrix-sans
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone Olauncher v6.7.1
        run: git clone --depth 1 --branch v6.7.1 https://github.com/tanujnotes/Olauncher.git olauncher

      - name: Download Matrix Sans
        run: |
          curl -L --fail -o matrix.zip https://github.com/FriedOrange/MatrixSans/releases/download/v1.722/MatrixSans-v1.722.zip
          unzip -q matrix.zip -d matrix-fonts
          find matrix-fonts -type f | sort

      - name: Apply Matrix Sans and fork identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p olauncher/app/src/main/res/font
          FONT_FILE="$(find matrix-fonts -type f \( -iname 'MatrixSans-Regular.ttf' -o -iname 'MatrixSans-Regular.otf' -o -iname '*MatrixSans*Regular*.ttf' -o -iname '*MatrixSans*Regular*.otf' \) | head -n 1)"
          test -n "$FONT_FILE"
          cp "$FONT_FILE" olauncher/app/src/main/res/font/matrix_sans_regular.ttf

          python3 - <<'PY'
          from pathlib import Path

          root = Path('olauncher')
          styles = root / 'app/src/main/res/values/styles.xml'
          text = styles.read_text()
          text = text.replace('<style name="TextDefault" parent="@android:style/TextAppearance.Large">', '<style name="TextDefault" parent="@android:style/TextAppearance.Large">\n        <item name="android:fontFamily">@font/matrix_sans_regular</item>')
          text = text.replace('<item name="android:fontFamily">sans-serif-light</item>', '<item name="android:fontFamily">@font/matrix_sans_regular</item>')
          styles.write_text(text)

          night = root / 'app/src/main/res/values-night/styles.xml'
          if night.exists():
              text = night.read_text()
              text = text.replace('<style name="TextDefault" parent="@android:style/TextAppearance.Large">', '<style name="TextDefault" parent="@android:style/TextAppearance.Large">\n        <item name="android:fontFamily">@font/matrix_sans_regular</item>')
              text = text.replace('<item name="android:fontFamily">sans-serif-light</item>', '<item name="android:fontFamily">@font/matrix_sans_regular</item>')
              night.write_text(text)

          for p in [root / 'app/src/main/res/layout/fragment_home.xml', root / 'app/src/main/res/layout-land/fragment_home.xml']:
              text = p.read_text().replace('android:fontFamily="sans-serif-light"', 'android:fontFamily="@font/matrix_sans_regular"')
              p.write_text(text)

          gradle = root / 'app/build.gradle'
          text = gradle.read_text().replace('applicationId "app.olauncher"', 'applicationId "app.olauncher.matrixsans"')
          text = text.replace('versionName "v6.7.1"', 'versionName "v6.7.1-matrix"')
          gradle.write_text(text)

          strings = root / 'app/src/main/res/values/strings.xml'
          text = strings.read_text().replace('<string name="app_name">Olauncher</string>', '<string name="app_name">Olauncher Matrix</string>')
          strings.write_text(text)
          PY

          cp matrix-fonts/OFL.txt olauncher/MATRIX_SANS_OFL.txt || true

      - name: Build signed debug APK
        working-directory: olauncher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: cp olauncher/app/build/outputs/apk/debug/app-debug.apk Olauncher-Matrix-Sans-v6.7.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Olauncher-Matrix-Sans-v6.7.1
          path: Olauncher-Matrix-Sans-v6.7.1.apk
          if-no-files-found: error
          retention-days: 7
