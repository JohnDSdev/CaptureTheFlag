name: Fix Olauncher Font Row

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download previous successful source build
        uses: actions/download-artifact@v4
        with:
          name: Olauncher-Font-Picker-v6.7.1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: JohnDSdev/CaptureTheFlag
          run-id: 31113792767
          path: previous

      - name: Extract and repair font row
        run: |
          mkdir fixed
          unzip -q previous/Olauncher-Font-Picker-v6.7.1-source.zip -d fixed
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('fixed/olauncher')
          layout = root / 'app/src/main/res/layout/fragment_settings.xml'
          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)
          ET.register_namespace('tools', 'http://schemas.android.com/tools')
          aid = lambda name: f'{{{android_ns}}}{name}'

          tree = ET.parse(layout)
          xml_root = tree.getroot()

          font_row = None
          font_parent = None
          text_size_row = None
          text_size_parent = None

          for parent in xml_root.iter():
              for child in list(parent):
                  ids = {node.attrib.get(aid('id')) for node in child.iter()}
                  if '@+id/fontValue' in ids:
                      font_row = child
                      font_parent = parent
                  if '@+id/textSizeValue' in ids:
                      text_size_row = child
                      text_size_parent = parent

          if None in (font_row, font_parent, text_size_row, text_size_parent):
              raise SystemExit('Could not locate font or text-size row')

          font_parent.remove(font_row)
          font_row.set(aid('id'), '@+id/fontRow')
          font_row.set(aid('clickable'), 'true')
          font_row.set(aid('focusable'), 'true')
          font_row.set(aid('foreground'), '?attr/selectableItemBackground')
          index = list(text_size_parent).index(text_size_row)
          text_size_parent.insert(index + 1, font_row)
          tree.write(layout, encoding='utf-8', xml_declaration=True)

          settings = root / 'app/src/main/java/app/olauncher/ui/SettingsFragment.kt'
          text = settings.read_text()
          text = text.replace('R.id.fontValue -> showFontPicker()', 'R.id.fontRow -> showFontPicker()')
          text = text.replace('binding.fontValue?.setOnClickListener(this)', 'binding.root.findViewById<View>(R.id.fontRow).setOnClickListener(this)')
          text = text.replace('binding.fontValue?.text = FontManager.selectedName(requireContext())', 'binding.root.findViewById<android.widget.TextView>(R.id.fontValue).text = FontManager.selectedName(requireContext())')
          text = text.replace('binding.fontValue.text = FontManager.selectedName(requireContext())', 'binding.root.findViewById<android.widget.TextView>(R.id.fontValue).text = FontManager.selectedName(requireContext())')
          settings.write_text(text)
          PY

      - name: Build repaired APK
        working-directory: fixed/olauncher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package repaired build
        run: |
          cp fixed/olauncher/app/build/outputs/apk/debug/app-debug.apk Olauncher-Font-Picker-v6.7.1-fixed.apk
          (cd fixed && zip -qr ../Olauncher-Font-Picker-v6.7.1-fixed-source.zip olauncher)
          sha256sum Olauncher-Font-Picker-v6.7.1-fixed.apk Olauncher-Font-Picker-v6.7.1-fixed-source.zip > Olauncher-Font-Picker-v6.7.1-fixed-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Olauncher-Font-Picker-v6.7.1-fixed
          path: |
            Olauncher-Font-Picker-v6.7.1-fixed.apk
            Olauncher-Font-Picker-v6.7.1-fixed-source.zip
            Olauncher-Font-Picker-v6.7.1-fixed-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
